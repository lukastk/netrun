[project]
name = "netrun-ui"
version = "0.2.0"
description = "Visual editor for netrun flow configurations"
requires-python = ">=3.11"
readme = "BACKEND_README.md"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "websockets>=12.0",
    "pywebview>=5.0.0",
    "netrun>=0.4.0",
]

[project.scripts]
netrun-ui = "netrun_ui_backend.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",  # For testing async endpoints
]

[tool.uv.sources]
netrun = { path = "../netrun", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netrun_ui_backend"]
# Include static files if they exist
artifacts = ["netrun_ui_backend/static"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "netrun_ui_backend/",
    "BACKEND_README.md",
    "hatch_build.py",
    "package.json",
    "package-lock.json",
    "svelte.config.js",
    "vite.config.ts",
    "tsconfig.json",
    "src/",
    "static/",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
