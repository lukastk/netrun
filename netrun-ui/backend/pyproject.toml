[project]
name = "netrun-ui"
version = "0.1.0"
description = "Visual editor for netrun flow configurations"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "websockets>=12.0",
    "pywebview>=5.0.0",
    "netrun",
]

[project.scripts]
netrun-ui = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",  # For testing async endpoints
]

[tool.uv.sources]
netrun = { path = "../../netrun" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Include static files if they exist
artifacts = ["app/static"]

[tool.hatch.build.targets.sdist]
include = [
    "app/",
    "README.md",
]
