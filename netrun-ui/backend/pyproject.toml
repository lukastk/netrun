[project]
name = "netrun-ui-backend"
version = "0.1.0"
description = "FastAPI backend for netrun-ui"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "websockets>=12.0",
    "netrun",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",  # For testing async endpoints
]
app = [
    "pywebview>=5.0.0",  # For native window mode
]

[tool.uv.sources]
netrun = { path = "../../netrun" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
