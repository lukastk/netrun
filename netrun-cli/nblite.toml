export_pipeline = """
nbs -> pts
pts -> lib

nbs_tests -> pts_tests
pts_tests -> lib_tests
"""

[cl.lib]
path="src/netrun_cli"
format="module"

[cl.nbs]
path="nbs/netrun_cli"
format="ipynb"

[cl.pts]
path="pts/netrun_cli"
format="percent"

[cl.lib_tests]
path="src/tests"
format="module"

[cl.nbs_tests]
path="nbs/tests"
format="ipynb"

[cl.pts_tests]
path="pts/tests"
format="percent"
