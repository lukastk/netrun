[project]
name = "netrun-utils-demo"
version = "0.1.0"
description = "Demo of netrun-utils observe and dev modules"
requires-python = ">=3.11"
dependencies = [
    "netrun",
    "netrun-utils[observe,dev]",
    "netrun-dashboard",
    "nblite>=1.1.5",
    "jupyterlab>=4.5.6",
    "netrun-ui>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodes"]

[tool.uv.sources]
netrun = { path = "../../netrun", editable = true }
netrun-utils = { path = "../../netrun-utils", editable = true }
netrun-sim = { path = "../../netrun-sim/python", editable = true }
netrun-ui = { path = "../../netrun-ui/", editable = true }
netrun-dashboard = { path = "../../netrun-dashboard", editable = true }
