[project]
name = "remote-deployment-example"
version = "0.1.0"
description = "Example: deploy netrun to a Hetzner Cloud server"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.3",
    "netrun",
    "netrun-ui",
    "pyinfra>=3.0",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
netrun = { path = "../../netrun" }
netrun-ui = { path = "../../netrun-ui" }

