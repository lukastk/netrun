[project]
name = "netrun-dashboard"
version = "0.1.0"
description = "Real-time dashboard for observing multiple running netrun Nets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
netrun-dashboard = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
