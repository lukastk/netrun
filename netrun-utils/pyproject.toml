[project]
name = "netrun-utils"
version = "0.1.0"
description = "Observability and development utilities for netrun."
requires-python = ">=3.11"
dependencies = [
    "netrun>=0.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
observe = ["fastapi>=0.109.0", "uvicorn[standard]>=0.27.0", "httpx>=0.25.0", "websockets>=12.0"]
dev = ["nest-asyncio>=1.6.0"]

[dependency-groups]
dev = [
    "netrun-utils[observe,dev]",
    "nblite>=1.1.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.25.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
netrun = { path = "../netrun", editable = true }
netrun-sim = { path = "../netrun-sim/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true
sources = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "__*.pct.py",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "E402",   # Module level import not at top
]

[tool.ruff.lint.per-file-ignores]
"*.pct.py" = [
    "I001", # Unsorted imports
    "E701", # Multiple statements on one line newline
    "E702", # Multiple statements on one line semicolon
    "E703", # useless-semicolon
]

[tool.ruff.lint.isort]
known-first-party = ["nblite"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]
